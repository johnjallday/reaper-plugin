name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test service
        run: go test -race ./...
      - name: Vet service
        run: go vet ./...
      - name: Test UI
        run: node --test ui/**/*.test.js
      - name: Package verified release asset
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/reaper-plugin_${GITHUB_REF_NAME}_darwin_arm64" \
            "dist/reaper-plugin_${GITHUB_REF_NAME}_darwin_arm64.sha256" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
