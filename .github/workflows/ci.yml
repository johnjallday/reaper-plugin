name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --test ui/**/*.test.js
      - name: Package verified candidate
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          ./scripts/package-release.sh "v${version}"
      - name: Check binary vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck -mode=binary artifacts/reaper-plugin-darwin-arm64
